<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay Console</title>
  <link rel="stylesheet" href="console.css" />
  <!-- TechLab's site-wide click sounds. -->
  <script defer src="../js/sfx.js"></script>
</head>
<body>
  <div class="app">
    <aside class="mission" aria-label="Mission">
      <div class="alert" id="alert" role="status"></div>
      <h1 class="lab-title" id="lab-title">Relay Console</h1>
      <ol class="steps" id="steps"></ol>
      <div class="mission-foot">
        <span class="progress" id="progress"></span>
        <button type="button" class="reset" id="reset">Restart lab</button>
      </div>
      <p class="tip">Tip: commands can be shortened, like on a real router (<code>sh ip int br</code>, <code>conf t</code>). Type <code>?</code> to list what works here.</p>
    </aside>

    <main class="console" aria-label="Router console">
      <div class="console-bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="console-title" id="console-title">Console</span>
      </div>
      <div class="screen" id="screen" tabindex="-1" aria-live="polite"></div>
      <form class="prompt-row" id="prompt-form" autocomplete="off">
        <label class="prompt" id="prompt" for="cmd">Router&gt;</label>
        <input id="cmd" class="cmd" type="text" spellcheck="false" autocapitalize="off" aria-label="Command" />
      </form>
    </main>
  </div>

  <div class="victory" id="victory" hidden role="dialog" aria-modal="true" aria-labelledby="victory-title">
    <div class="victory-card">
      <div class="victory-kicker">Lab complete</div>
      <h2 id="victory-title">RELAY ONLINE</h2>
      <p id="victory-text"></p>
      <button type="button" id="victory-close">Keep exploring</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
