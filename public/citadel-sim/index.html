<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citadel Sim</title>
  <link rel="stylesheet" href="citadel.css" />
</head>
<body>
  <div class="app">
    <aside class="mission" aria-label="Mission">
      <div class="alert" id="alert" role="alert"></div>
      <div class="vex" id="vex" hidden>
        <div class="vex-kicker">Intercepted transmission</div>
        <p id="vex-text"></p>
      </div>
      <h1 class="lab-title" id="lab-title">Citadel Sim</h1>
      <ol class="steps" id="steps"></ol>
      <section class="astro-help" id="astro-help" hidden aria-label="Ask Astro">
        <button type="button" class="astro-toggle" id="astro-toggle" aria-expanded="false" aria-controls="astro-panel">
          <span class="astro-badge" aria-hidden="true">A</span>
          <span class="astro-toggle-text">
            <strong>Stuck? Ask Astro</strong>
            <span id="astro-toggle-sub">Astro reads your terminal and tells you what to try.</span>
          </span>
        </button>
        <div class="astro-panel" id="astro-panel" hidden>
          <div class="astro-gate" id="astro-gate">
            <p class="astro-gate-text" id="astro-gate-text">Checking your XP...</p>
            <p class="astro-gate-hint" id="astro-gate-hint" hidden></p>
            <button type="button" class="astro-unlock" id="astro-unlock" hidden></button>
          </div>
          <div class="astro-chat" id="astro-chat" hidden>
            <div class="astro-log" id="astro-log" aria-live="polite"></div>
            <form class="astro-form" id="astro-form" autocomplete="off">
              <input id="astro-question" class="astro-question" type="text" maxlength="600"
                     placeholder="Why isn't my command working?" aria-label="Question for Astro" />
              <button type="submit" class="astro-send" id="astro-send">Ask</button>
            </form>
          </div>
        </div>
      </section>
      <div class="mission-foot">
        <span class="progress" id="progress"></span>
        <button type="button" class="reset" id="reset">Restart lab</button>
      </div>
      <p class="ethics">Volt's rule: only test systems you are authorized to test. Everything here is a training copy of the Citadel.</p>
    </aside>

    <main class="console" aria-label="Command Prompt">
      <div class="console-bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="console-title" id="console-title">Command Prompt</span>
      </div>
      <div class="screen" id="screen" tabindex="-1" aria-live="polite"></div>
      <form class="prompt-row" id="prompt-form" autocomplete="off">
        <label class="prompt" id="prompt" for="cmd">C:\Citadel&gt;</label>
        <input id="cmd" class="cmd" type="text" spellcheck="false" autocapitalize="off" aria-label="Command" />
      </form>
    </main>
  </div>

  <div class="victory" id="victory" hidden role="dialog" aria-modal="true" aria-labelledby="victory-title">
    <div class="victory-card">
      <div class="victory-kicker">Lab complete</div>
      <h2 id="victory-title">DOOM ATTACK REPELLED</h2>
      <p id="victory-text"></p>
      <button type="button" id="victory-close">Keep exploring</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
