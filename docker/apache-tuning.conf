# Sized for a 512 MB Render instance. Each PHP worker uses ~30-50 MB, so Apache's default of
# 150 workers would run the box out of memory under a rush and crash it. With a cap, extra
# requests wait in the listen queue for a free worker instead of failing.
# Measured: 25 workers peak around 140 MB, since most of a request is waiting on the database.
# Keep DB_PORT=6543 (transaction pooler) with this many workers; session mode allows only 15.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    ServerLimit             ${APACHE_MAX_WORKERS}
    MaxRequestWorkers       ${APACHE_MAX_WORKERS}
    # Recycle a worker now and then so slow memory growth can't pile up.
    MaxConnectionsPerChild  1000
</IfModule>

ListenBacklog 511
# Free a worker quickly when a browser leaves a connection open and idle.
KeepAliveTimeout 2
# Astro answers stream for a while; don't cut them off.
Timeout 300
ServerName localhost
