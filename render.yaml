# Render Blueprint for TechLab. Secrets use `sync: false`: Render asks for them on first setup.
services:
  - type: web
    name: techlab
    runtime: docker
    plan: free
    region: singapore          # closest Render region to the Supabase database (Seoul)
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    # Load balancing: Render spreads traffic across every running instance by itself, and the app
    # is ready for it (sessions and queue in Postgres; uploads in Supabase;
    # rate limits count per instance). The free plan runs one instance only. On a paid plan,
    # set `plan: starter` (or higher) and uncomment ONE of these:
    # numInstances: 2
    # scaling:                 # autoscaling needs a Professional workspace
    #   minInstances: 1
    #   maxInstances: 3
    #   targetCPUPercent: 70
    #   targetMemoryPercent: 80
    # With more than one instance, also add `preDeployCommand: php artisan migrate --force` and
    # set RUN_MIGRATIONS=false, so only one copy updates the database per deploy.
    envVars:
      - key: APACHE_MAX_WORKERS  # PHP workers per instance; 25 measured at ~140 MB peak on 512 MB
        value: "25"
      - key: APP_NAME
        value: TechLab
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file        # local and fast; a database cache made every page wait on Seoul (6x slower)
      - key: CACHE_LIMITER
        value: apc         # rate-limit counts in shared memory: exact and instant
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-northeast-2.pooler.supabase.com
      - key: DB_PORT
        value: "6543"        # transaction pooler: session mode (5432) caps at 15 connections and failed under load
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.hbufjfyxeqrjbqcupncm
      - key: DB_PASSWORD
        sync: false
      - key: DB_PERSISTENT
        value: "true"
      - key: FILESYSTEM_DISK
        value: local
      - key: PUBLIC_DISK
        value: supabase
      - key: SUPABASE_S3_KEY
        sync: false
      - key: SUPABASE_S3_SECRET
        sync: false
      - key: SUPABASE_S3_REGION
        value: ap-northeast-2
      - key: SUPABASE_S3_ENDPOINT
        value: https://hbufjfyxeqrjbqcupncm.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_PUBLIC_URL
        value: https://hbufjfyxeqrjbqcupncm.supabase.co/storage/v1/object/public/techlab-public
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: techlab.astro@gmail.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: techlab.astro@gmail.com
      - key: MAIL_FROM_NAME
        value: TechLab
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_NIM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_NIM_MODEL_LABEL
        value: "Astro · Nemotron 3 Ultra"
      - key: NVIDIA_NIM_TOP_P
        value: "0.9"
      - key: NVIDIA_NIM_TEMPERATURE
        value: "0.4"
      - key: NVIDIA_NIM_MAX_TOKENS
        value: "800"
      - key: NVIDIA_NIM_ENABLE_THINKING
        value: "false"
      - key: NVIDIA_NIM_REASONING_BUDGET
        value: "1024"
      - key: NVIDIA_NIM_MEDIUM_EFFORT
        value: "true"
      - key: INFOGRAPHIC_NIM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: INFOGRAPHIC_IMAGE_PROVIDER
        value: nvidia
      - key: NVIDIA_IMAGE_MODEL
        value: black-forest-labs/flux.1-schnell
      - key: NVIDIA_IMAGE_BASE_URL
        value: https://ai.api.nvidia.com/v1/genai
      - key: WEB_SEARCH_API_KEY
        sync: false
